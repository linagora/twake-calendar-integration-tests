version: "3"

networks:
  emaily:
    driver: bridge

services:
  twake-calendar-side-service:
    image: tcalendar-it
    depends_on:
      opensearch:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      ldap:
        condition: service_started
      sabre_dav:
        condition: service_started
    networks:
      - emaily

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200/_cluster/health" ]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - emaily

  rabbitmq:
    image: rabbitmq:4.1.1-management
    networks:
      - emaily

  mongo:
    image: mongo:8.0.6
    networks:
      - emaily

  ldap:
    hostname: esn_ldap
    image: ldap-it
    environment:
      - LDAP_PORT_NUMBER=389
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_ROOT=dc=open-paas.org,dc=lng
      - BITNAMI_DEBUG=true
    networks:
      - emaily

  sabre_dav:
    hostname: esn_sabre
    image: ${SABRE_DAV_IMAGE}
    environment:
      - SABRE_CONFIG_JSON=${SABRE_CONFIG_JSON}
      - OPENPASS_BASIC_AUTH=YWRtaW5Ab3Blbi1wYWFzLm9yZzpzZWNyZXQ=
      - LDAP_BASE_WITH_MAIL=ou=users,dc=open-paas.org,dc=lng
    networks:
      - emaily
